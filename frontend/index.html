<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Code Safety Scanner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>QR Code Safety Scanner</h1>
    <input type="file" id="qrInput" accept="image/*">
    <button id="scanBtn">Scan QR Code</button>

    <div id="result" class="hidden">
      <h2>Decoded URL:</h2>
      <p id="decodedUrl"></p>

      <h2>Verdict:</h2>
      <div id="verdictCard"></div>

      <h2>Risk Score:</h2>
      <p id="riskScore"></p>

      <h2>Why:</h2>
      <ul id="flagsList"></ul>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
  <script src="script.js"></script>
</body>
</html>
